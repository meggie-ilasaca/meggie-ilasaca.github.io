<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Titicaca Kawsay - Helados Artesanales del Altiplano</title>
<meta name="description" content="Paletas artesanales de frutos nativos del altiplano puneño: sanky, aguaymanto, tuna, saúco, capulí, papayuela y granadilla de monte. Sin lactosa ni gluten. Desaguadero, Puno.">
<meta name="keywords" content="helados artesanales, Puno, Titicaca, sanky, aguaymanto, frutos andinos, Desaguadero, paletas">
<meta name="author" content="Titicaca Kawsay S.A.C.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --azul-andino: #1B3A5C;
  --dorado-inca: #D4A017;
  --celeste-lago: #4A9FBF;
  --rojo-chicha: #C0392B;
  --verde-natural: #7D8C3A;
  --crema-helado: #F5E6D3;
  --blanco: #FFFFFF;
  --negro-suave: #2C3E50;
  --gris-suave: #f0f4f7;
  --fuente-titulos: 'Poppins', system-ui, sans-serif;
  --fuente-texto: 'Inter', system-ui, sans-serif;
  --radio: 16px;
  --sombra: 0 6px 20px rgba(27, 58, 92, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--fuente-texto);
  color: var(--negro-suave);
  line-height: 1.6;
  background: var(--blanco);
}

h1, h2, h3, h4 { font-family: var(--fuente-titulos); color: var(--azul-andino); }

img { max-width: 100%; display: block; }

a { transition: all 0.3s; }

/* ============ HEADER ============ */
header {
  background: var(--blanco);
  box-shadow: var(--sombra);
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 0.8rem 2rem;
}

.header-contenido {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  text-decoration: none;
}

.logo-icono {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, var(--azul-andino), var(--celeste-lago));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dorado-inca);
  font-size: 1.5rem;
  flex-shrink: 0;
}

.logo-texto { display: flex; flex-direction: column; line-height: 1.1; }
.logo-texto h1 { font-size: 1.2rem; letter-spacing: 1.5px; margin: 0; }
.logo-texto span { font-size: 0.65rem; letter-spacing: 2.5px; color: var(--dorado-inca); font-weight: 600; }
.logo-texto small { font-size: 0.6rem; color: var(--celeste-lago); letter-spacing: 1px; }

nav ul { list-style: none; display: flex; gap: 1.5rem; }

nav a {
  text-decoration: none;
  color: var(--azul-andino);
  font-weight: 500;
  font-size: 0.95rem;
  padding: 0.3rem 0;
  border-bottom: 2px solid transparent;
}

nav a:hover { color: var(--dorado-inca); border-bottom-color: var(--dorado-inca); }

.btn-header {
  background: var(--dorado-inca);
  color: var(--azul-andino);
  padding: 0.6rem 1.2rem;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
}

.btn-header:hover { background: var(--azul-andino); color: var(--dorado-inca); }

/* ============ HERO ============ */
.hero {
  background: linear-gradient(135deg, var(--azul-andino) 0%, var(--celeste-lago) 100%);
  color: var(--blanco);
  padding: 4rem 2rem;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: radial-gradient(circle at 80% 30%, rgba(212,160,23,0.15) 0%, transparent 50%);
  pointer-events: none;
}

.hero-contenido {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: center;
  position: relative;
  z-index: 2;
}

.hero-etiqueta {
  display: inline-block;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: var(--blanco);
  padding: 0.4rem 1rem;
  border-radius: 50px;
  font-size: 0.85rem;
  margin-bottom: 1.5rem;
  backdrop-filter: blur(10px);
}

.hero h2 {
  font-size: clamp(2rem, 4vw, 3.2rem);
  color: var(--blanco);
  margin-bottom: 1.2rem;
  line-height: 1.15;
}

.hero h2 span { color: var(--dorado-inca); font-style: italic; }

.hero p {
  font-size: 1.05rem;
  margin-bottom: 2rem;
  opacity: 0.95;
  max-width: 500px;
}

.hero-botones { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }

.btn {
  padding: 0.9rem 2rem;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 600;
  font-size: 1rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
  border: none;
}

.btn-primario { background: var(--dorado-inca); color: var(--azul-andino); }
.btn-primario:hover { background: var(--blanco); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

.btn-secundario { background: var(--blanco); color: var(--azul-andino); }
.btn-secundario:hover { background: var(--dorado-inca); transform: translateY(-3px); }

.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
  border-top: 1px solid rgba(255,255,255,0.2);
  padding-top: 2rem;
  margin-top: 1rem;
}

.hero-stat h3 { color: var(--dorado-inca); font-size: 1.8rem; margin: 0; }
.hero-stat p { font-size: 0.85rem; margin: 0; opacity: 0.9; }

.hero-imagen {
  position: relative;
  text-align: center;
}

.hero-imagen img {
  max-width: 100%;
  height: auto;
  filter: drop-shadow(0 20px 40px rgba(0,0,0,0.3));
  animation: flotar 3s ease-in-out infinite;
}

@keyframes flotar {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* Banda de beneficios */
.banda-beneficios {
  background: var(--dorado-inca);
  color: var(--azul-andino);
  padding: 1rem 2rem;
  overflow: hidden;
  white-space: nowrap;
}

.banda-contenido {
  display: inline-block;
  animation: desplazar 30s linear infinite;
  font-weight: 600;
  font-size: 0.95rem;
}

.banda-contenido span { margin: 0 2rem; }

@keyframes desplazar {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ============ SECCIONES ============ */
section { padding: 5rem 2rem; }

.contenedor { max-width: 1200px; margin: 0 auto; }

.etiqueta-seccion {
  display: inline-block;
  background: var(--gris-suave);
  color: var(--azul-andino);
  padding: 0.3rem 1rem;
  border-radius: 50px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 1rem;
}

.titulo-seccion {
  text-align: center;
  font-size: clamp(1.8rem, 3.5vw, 2.5rem);
  margin-bottom: 0.8rem;
}

.subtitulo-seccion {
  text-align: center;
  color: var(--negro-suave);
  margin-bottom: 3rem;
  font-size: 1.05rem;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}

/* ============ PRODUCTOS ============ */
#productos { background: var(--crema-helado); }

.grid-productos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
}

.tarjeta-producto {
  background: var(--blanco);
  border-radius: var(--radio);
  overflow: hidden;
  box-shadow: var(--sombra);
  transition: transform 0.3s, box-shadow 0.3s;
  text-align: center;
  display: flex;
  flex-direction: column;
}

.tarjeta-producto:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(27, 58, 92, 0.15); }

.tarjeta-producto .color-barra { height: 6px; width: 100%; }

.tarjeta-producto .imagen-producto {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: var(--gris-suave);
  padding: 1rem;
}

.tarjeta-producto .contenido { padding: 1.3rem; display: flex; flex-direction: column; flex-grow: 1; }

.tarjeta-producto h3 { font-size: 1.2rem; margin-bottom: 0.2rem; }

.tarjeta-producto .cientifico {
  font-size: 0.75rem;
  color: var(--celeste-lago);
  font-style: italic;
  margin-bottom: 0.8rem;
}

.tarjeta-producto .descripcion {
  font-size: 0.85rem;
  color: var(--negro-suave);
  margin-bottom: 1rem;
  flex-grow: 1;
}

.tarjeta-producto .nutricion {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.nutri-badge {
  background: var(--gris-suave);
  color: var(--azul-andino);
  padding: 0.2rem 0.5rem;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
}

.tarjeta-producto .precio {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--rojo-chicha);
  margin-bottom: 1rem;
}

.tarjeta-producto .controles {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 1rem;
}

.btn-cantidad {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--celeste-lago);
  color: var(--blanco);
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s;
}

.btn-cantidad:hover { background: var(--azul-andino); }

.cantidad-num {
  font-size: 1.2rem;
  font-weight: 600;
  min-width: 30px;
  color: var(--azul-andino);
}

.btn-pedido {
  background: var(--azul-andino);
  color: var(--blanco);
  padding: 0.7rem 1.5rem;
  border-radius: 50px;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  border: none;
  cursor: pointer;
  width: 100%;
}

.btn-pedido:hover { background: var(--dorado-inca); color: var(--azul-andino); }

/* Nota nutricional */
.nota-nutricional {
  text-align: center;
  font-size: 0.85rem;
  color: var(--negro-suave);
  margin-top: 2rem;
  padding: 1rem;
  background: rgba(255,255,255,0.6);
  border-radius: var(--radio);
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}

/* ============ CARRITO / PEDIDO ============ */
#pedido { background: var(--blanco); }

.caja-pedido {
  max-width: 600px;
  margin: 0 auto;
  background: var(--azul-andino);
  color: var(--blanco);
  padding: 2rem;
  border-radius: var(--radio);
  box-shadow: 0 15px 40px rgba(27, 58, 92, 0.3);
}

.caja-pedido h3 { color: var(--blanco); font-size: 1.3rem; margin-bottom: 1rem; text-align: center; }

.resumen-pedido {
  background: rgba(255,255,255,0.1);
  padding: 1rem;
  border-radius: 10px;
  min-height: 60px;
  margin-bottom: 1rem;
  font-size: 0.9rem;
}

.resumen-pedido .vacio { text-align: center; opacity: 0.7; font-style: italic; }

.item-pedido {
  display: flex;
  justify-content: space-between;
  padding: 0.3rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.item-pedido:last-child { border-bottom: none; }

.total-pedido {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 1rem;
  color: var(--dorado-inca);
}

.botones-pedido { display: grid; grid-template-columns: 1fr 2fr; gap: 0.8rem; }

.btn-limpiar {
  background: transparent;
  color: var(--blanco);
  border: 2px solid var(--blanco);
  padding: 0.7rem;
  border-radius: 50px;
  cursor: pointer;
  font-weight: 600;
}

.btn-limpiar:hover { background: var(--blanco); color: var(--azul-andino); }

.btn-whatsapp {
  background: #25D366;
  color: var(--blanco);
  border: none;
  padding: 0.7rem;
  border-radius: 50px;
  cursor: pointer;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  text-decoration: none;
  font-size: 1rem;
}

.btn-whatsapp:hover { background: #128C7E; transform: translateY(-2px); }

.nota-pedido {
  font-size: 0.75rem;
  opacity: 0.8;
  margin-top: 1rem;
  text-align: center;
}

/* ============ PROMOCIONES ============ */
#promociones { background: var(--blanco); }

.grid-promociones {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
  margin-bottom: 3rem;
}

.tarjeta-promo {
  padding: 2rem;
  border-radius: var(--radio);
  color: var(--blanco);
  position: relative;
  overflow: hidden;
}

.tarjeta-promo h3 { color: var(--blanco); font-size: 1.3rem; margin-bottom: 0.5rem; }
.tarjeta-promo p { font-size: 0.9rem; opacity: 0.95; margin-bottom: 1rem; }
.tarjeta-promo .precio-promo { font-size: 2.5rem; font-weight: 700; color: var(--blanco); margin-bottom: 0.5rem; }

.promo-andino { background: linear-gradient(135deg, #4A9FBF, #1B3A5C); }
.promo-familia { background: linear-gradient(135deg, #E67E22, #C0392B); }
.promo-martes { background: linear-gradient(135deg, #D4A017, #C0392B); grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; }

.badge-martes {
  background: rgba(255,255,255,0.25);
  padding: 0.8rem 1.2rem;
  border-radius: 10px;
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--blanco);
  border: 2px dashed rgba(255,255,255,0.5);
}

.btn-promo {
  background: var(--blanco);
  color: var(--azul-andino);
  padding: 0.6rem 1.5rem;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 600;
  display: inline-block;
  font-size: 0.9rem;
}

.btn-promo:hover { background: var(--dorado-inca); transform: scale(1.05); }

/* Club Kawsay */
.club {
  background: var(--gris-suave);
  padding: 3rem 2rem;
  border-radius: var(--radio);
  margin-top: 2rem;
}

.club h3 { text-align: center; font-size: 1.8rem; margin-bottom: 0.5rem; }
.club > p { text-align: center; color: var(--negro-suave); margin-bottom: 2.5rem; }

.grid-club {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
}

.nivel-club {
  background: var(--blanco);
  padding: 1.5rem;
  border-radius: var(--radio);
  text-align: center;
  border-top: 4px solid var(--dorado-inca);
  transition: transform 0.3s;
}

.nivel-club:hover { transform: translateY(-5px); }

.nivel-club .icono-nivel { font-size: 2.5rem; margin-bottom: 0.5rem; }
.nivel-club h4 { font-size: 1.1rem; margin-bottom: 0.3rem; }
.nivel-club .requisito { font-size: 0.8rem; color: var(--rojo-chicha); font-weight: 700; margin-bottom: 0.8rem; }
.nivel-club p { font-size: 0.85rem; }

/* ============ PUNTOS DE VENTA ============ */
#puntos { background: var(--gris-suave); }

.grid-puntos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1.5rem;
}

.punto-card {
  background: var(--blanco);
  padding: 1.5rem;
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  transition: transform 0.3s;
}

.punto-card:hover { transform: translateY(-5px); }

.punto-card .icono-punto {
  width: 50px;
  height: 50px;
  background: var(--crema-helado);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  margin-bottom: 1rem;
}

.punto-card h4 { font-size: 1.1rem; margin-bottom: 0.5rem; }
.punto-card p { font-size: 0.85rem; margin-bottom: 0.3rem; }
.punto-card .horario { color: var(--rojo-chicha); font-weight: 600; font-size: 0.8rem; margin-top: 0.5rem; }

/* ============ NOSOTROS ============ */
#nosotros { background: var(--azul-andino); color: var(--blanco); }
#nosotros .titulo-seccion { color: var(--blanco); }
#nosotros .subtitulo-seccion { color: var(--crema-helado); }
#nosotros .etiqueta-seccion { background: rgba(255,255,255,0.15); color: var(--dorado-inca); }

.contenido-nosotros {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
  align-items: start;
}

.nosotros-historia p { color: var(--blanco); opacity: 0.95; margin-bottom: 1rem; text-align: justify; }

.nosotros-mv { display: flex; flex-direction: column; gap: 1.5rem; }

.mv-caja {
  background: rgba(255,255,255,0.08);
  padding: 1.5rem;
  border-radius: var(--radio);
  border-left: 4px solid var(--dorado-inca);
}

.mv-caja h4 { color: var(--dorado-inca); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
.mv-caja p { color: var(--blanco); opacity: 0.95; font-size: 0.9rem; }

.stats-nosotros {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
  margin: 3rem 0;
  padding: 2rem 0;
  border-top: 1px solid rgba(255,255,255,0.15);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  text-align: center;
}

.stat-item h3 { color: var(--dorado-inca); font-size: 2rem; margin-bottom: 0.2rem; }
.stat-item p { color: var(--crema-helado); font-size: 0.8rem; }

.comunidades {
  background: rgba(212,160,23,0.15);
  padding: 1.5rem;
  border-radius: var(--radio);
  border: 1px solid var(--dorado-inca);
  margin-top: 2rem;
}

.comunidades h4 { color: var(--dorado-inca); margin-bottom: 1rem; }
.comunidades-tags { display: flex; gap: 0.8rem; flex-wrap: wrap; }
.comunidades-tags span {
  background: var(--dorado-inca);
  color: var(--azul-andino);
  padding: 0.4rem 1rem;
  border-radius: 50px;
  font-weight: 600;
  font-size: 0.85rem;
}

/* ============ CALIDAD ============ */
#calidad { background: var(--blanco); }

.grid-calidad {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1.5rem;
}

.sello {
  background: var(--gris-suave);
  padding: 2rem 1.5rem;
  border-radius: var(--radio);
  text-align: center;
  border: 2px solid var(--crema-helado);
  transition: transform 0.3s;
}

.sello:hover { transform: translateY(-5px); border-color: var(--dorado-inca); }

.sello i { font-size: 2.5rem; color: var(--dorado-inca); margin-bottom: 1rem; }
.sello h4 { font-size: 1rem; margin-bottom: 0.5rem; }
.sello p { font-size: 0.8rem; color: var(--negro-suave); }

/* ============ ODS ============ */
.ods {
  margin-top: 3rem;
  padding: 2rem;
  background: var(--crema-helado);
  border-radius: var(--radio);
  text-align: center;
}

.ods h4 { margin-bottom: 1rem; }
.ods-tags { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
.ods-tags span {
  background: var(--azul-andino);
  color: var(--blanco);
  padding: 0.5rem 1rem;
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 600;
}

/* ============ CONTACTO ============ */
#contacto { background: var(--crema-helado); }

.grid-contacto {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3rem;
}

.info-contacto p {
  margin-bottom: 1rem;
  display: flex;
  align-items: flex-start;
  gap: 0.8rem;
  font-size: 0.95rem;
}

.info-contacto i {
  color: var(--dorado-inca);
  font-size: 1.2rem;
  width: 25px;
  margin-top: 0.3rem;
  flex-shrink: 0;
}

.formulario {
  background: var(--blanco);
  padding: 2rem;
  border-radius: var(--radio);
  box-shadow: var(--sombra);
}

.formulario label {
  display: block;
  margin-bottom: 0.3rem;
  font-weight: 600;
  color: var(--azul-andino);
  font-size: 0.9rem;
}

.formulario input,
.formulario textarea,
.formulario select {
  width: 100%;
  padding: 0.8rem;
  margin-bottom: 1rem;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-family: var(--fuente-texto);
  font-size: 1rem;
  transition: border-color 0.3s;
}

.formulario input:focus,
.formulario textarea:focus,
.formulario select:focus {
  outline: none;
  border-color: var(--celeste-lago);
  box-shadow: 0 0 0 3px rgba(74,159,191,0.15);
}

.formulario button {
  background: var(--azul-andino);
  color: var(--blanco);
  padding: 0.9rem 2rem;
  border: none;
  border-radius: 50px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  font-size: 1rem;
  transition: background 0.3s;
}

.formulario button:hover { background: var(--dorado-inca); color: var(--azul-andino); }

/* ============ FOOTER ============ */
footer {
  background: var(--azul-andino);
  color: var(--blanco);
  padding: 3rem 2rem 2rem;
}

.footer-contenido {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1.5fr;
  gap: 2rem;
  margin-bottom: 2rem;
}

.footer-col h4 { color: var(--dorado-inca); margin-bottom: 1rem; font-size: 1rem; }

.footer-col p,
.footer-col a {
  color: var(--blanco);
  opacity: 0.85;
  text-decoration: none;
  font-size: 0.9rem;
  display: block;
  margin-bottom: 0.5rem;
}

.footer-col a:hover { color: var(--dorado-inca); opacity: 1; }

.footer-logo { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; }
.footer-logo .logo-icono { width: 45px; height: 45px; }
.footer-logo h3 { color: var(--blanco); margin: 0; font-size: 1.1rem; }

.footer-eslogan { color: var(--dorado-inca); font-style: italic; font-weight: 600; margin-top: 0.5rem; }

.redes-sociales { display: flex; gap: 1rem; margin-top: 1rem; }
.redes-sociales a {
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  margin: 0;
}

.redes-sociales a:hover { background: var(--dorado-inca); color: var(--azul-andino); }

.footer-bottom {
  border-top: 1px solid rgba(255,255,255,0.15);
  padding-top: 1.5rem;
  text-align: center;
  font-size: 0.85rem;
  opacity: 0.75;
}

/* ============ WHATSAPP FLOTANTE ============ */
.whatsapp-flotante {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #25D366;
  color: var(--blanco);
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  box-shadow: 0 4px 20px rgba(37, 211, 102, 0.5);
  text-decoration: none;
  z-index: 999;
  animation: pulso 2s infinite;
}

.whatsapp-flotante:hover { transform: scale(1.1); }

@keyframes pulso {
  0%, 100% { box-shadow: 0 4px 20px rgba(37, 211, 102, 0.5); }
  50% { box-shadow: 0 4px 30px rgba(37, 211, 102, 0.8); }
}

/* ============ AVISO COOKIES ============ */
.aviso-cookies {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--negro-suave);
  color: var(--blanco);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  z-index: 1000;
  font-size: 0.9rem;
  flex-wrap: wrap;
}

.aviso-cookies a { color: var(--dorado-inca); }

.aviso-cookies button {
  background: var(--dorado-inca);
  color: var(--azul-andino);
  border: none;
  padding: 0.6rem 1.5rem;
  border-radius: 50px;
  font-weight: 600;
  cursor: pointer;
}

.aviso-cookies button:hover { background: var(--crema-helado); }

/* ============ RESPONSIVE ============ */
@media (max-width: 900px) {
  .hero-contenido { grid-template-columns: 1fr; text-align: center; }
  .hero p { margin-left: auto; margin-right: auto; }
  .hero-botones { justify-content: center; }
  .hero-imagen { max-width: 300px; margin: 0 auto; }
  .contenido-nosotros { grid-template-columns: 1fr; }
  .grid-contacto { grid-template-columns: 1fr; }
  .footer-contenido { grid-template-columns: 1fr 1fr; }
  .stats-nosotros { grid-template-columns: 1fr 1fr; }
  .hero-stats { grid-template-columns: 1fr 1fr; gap: 1rem; }
}

@media (max-width: 600px) {
  header { padding: 0.6rem 1rem; }
  nav ul { gap: 0.8rem; font-size: 0.8rem; }
  .logo-texto h1 { font-size
